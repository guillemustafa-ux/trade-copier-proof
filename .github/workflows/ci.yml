name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Linux: a postgres:16 service container, passed to the tests as DATABASE_URL.
  suite-ubuntu:
    name: "baseline (ubuntu, postgres:16 service): suite must pass"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Windows: no service containers there, so this job uses the runner's preinstalled PostgreSQL 17
  # (installed with the service stopped and disabled; user postgres, password root).
  suite-windows:
    name: "baseline (windows, runner PostgreSQL 17): suite must pass"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Start the runner's PostgreSQL 17
        shell: pwsh
        run: |
          Set-Service postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17
          for ($i = 1; $i -le 30; $i++) {
            & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -p 5432
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 1
          }
          Write-Error "PostgreSQL 17 was not ready after 30 seconds"
          exit 1
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:root@127.0.0.1:5432/postgres

  # The suite is only trustworthy if it BITES. Each footgun reintroduces one real mistake;
  # the runner exits 0 only when exactly the tests documented for it fail.
  footgun-must-be-caught:
    name: "footgun ${{ matrix.footgun }}: exactly its tests must fail"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        footgun:
          - blind-retry-on-timeout
          - treat-200-as-placed
          - intent-after-send
          - no-grace-window
          - ignore-captcha
          - feed-no-dedupe
          - close-from-belief
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run footgun -- ${{ matrix.footgun }}
